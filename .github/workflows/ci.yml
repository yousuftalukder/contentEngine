# Tests run on everything. The image is built by image.yml, which only runs when something that goes into it changes —
# a private repo's Actions allowance is 2,000 minutes a month, and a full image build is most of every run's cost.
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The runner's own Ubuntu mirror (azure.archive.ubuntu.com) stopped serving packages on 2026-10-07 — once it held
      # this step for the job's whole 45 minutes and the tests never ran, then it refused every download. So: a few
      # minutes on that mirror, then Ubuntu's main archive instead; apt gives up on a silent server after 30 s.
      - name: Video tools (same packages as the Dockerfile)
        timeout-minutes: 15
        run: |
          APT="-o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          PKGS="ffmpeg fontconfig fonts-noto-core fonts-dejavu-core"
          # Eight minutes: a mirror that is merely slow (2026-10-09, cut off mid-unpack at five) is not a dead one. And an
          # install cut off mid-unpack leaves dpkg interrupted, which refuses every later install until it is told to
          # finish configuring — so the fallback does that first, then carries on from where the download got to.
          if ! timeout 480 sh -c "sudo apt-get $APT update && sudo apt-get $APT install -y --no-install-recommends $PKGS"; then
            echo "The runner's mirror is not answering; using archive.ubuntu.com"
            sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
            sudo dpkg --configure -a || true
            sudo apt-get $APT update && sudo apt-get $APT install -y --no-install-recommends $PKGS
          fi
      - run: npm ci
      - run: node --check server.js
      - run: npm test
