# Tests run on everything. The image is built by image.yml, which only runs when something that goes into it changes —
# a private repo's Actions allowance is 2,000 minutes a month, and a full image build is most of every run's cost.
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # A mirror that stops answering once held this step for the job's whole 45 minutes (2026-10-07) and the tests never
      # ran: apt gives up on a silent mirror after 30 s and tries again, and the step itself stops after 10 minutes.
      - name: Video tools (same packages as the Dockerfile)
        timeout-minutes: 10
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $APT update && sudo apt-get $APT install -y --no-install-recommends ffmpeg fontconfig fonts-noto-core fonts-dejavu-core
      - run: npm ci
      - run: node --check server.js
      - run: npm test
