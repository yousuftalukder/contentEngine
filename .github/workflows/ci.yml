# Tests run on everything. The image is built by image.yml, which only runs when something that goes into it changes —
# a private repo's Actions allowance is 2,000 minutes a month, and a full image build is most of every run's cost.
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Video tools (same packages as the Dockerfile)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fontconfig fonts-noto-core fonts-dejavu-core
      - run: npm ci
      - run: node --check server.js
      - run: npm test
