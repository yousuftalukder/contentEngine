# The exact image Render builds: headless Chrome, its libraries, fonts, the studio bundle — proven by rendering in it.
# It costs about two minutes of the month's Actions allowance per run, so it runs when its own inputs change (and on
# demand), rather than on every push to every branch.
name: Image
on:
  push:
    branches: [main]
    paths: [Dockerfile, .dockerignore, studio/**, package.json, package-lock.json, .github/workflows/image.yml]
  pull_request:
    paths: [Dockerfile, .dockerignore, studio/**, package.json, package-lock.json, .github/workflows/image.yml]
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build -t content-engine:ci .
      - name: Render a news reel and an explainer frame inside the image
        run: |
          docker run --rm content-engine:ci sh -c 'cd studio && echo "{}" > /tmp/p.json \
            && node render.mjs /tmp/p.json /tmp/reel.mp4 NewsReel video \
            && node render.mjs /tmp/p.json /tmp/explainer.png Explainer still \
            && ffprobe -v error -show_entries stream=codec_name,width,height -of csv=p=0 /tmp/reel.mp4 && ls -la /tmp/explainer.png'
      - name: Bangla photocard text with complex shaping inside the image
        run: |
          docker run --rm content-engine:ci sh -c 'printf "[Script Info]\nScriptType: v4.00+\nPlayResX: 800\nPlayResY: 200\n\n[V4+ Styles]\nFormat: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding\nStyle: H,Noto Sans Bengali,48,&H00FFFFFF,&H00FFFFFF,&H00000000,&H00000000,-1,0,0,0,100,100,0,0,1,0,0,7,20,20,20,1\n\n[Events]\nFormat: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text\nDialogue: 0,0:00:00.00,0:00:05.00,H,,0,0,0,,সিলেটে বন্যা পরিস্থিতির অবনতি\n" > /tmp/t.ass \
            && ffmpeg -hide_banner -loglevel error -y -f lavfi -i color=c=0x0b3d91:s=800x200:d=1 -vf "ass=filename=/tmp/t.ass:shaping=complex" -frames:v 1 /tmp/t.png && ls -la /tmp/t.png && fc-list | grep -c "Noto Sans Bengali"'
      - name: Piper speaks, inside the image
        run: |
          docker run --rm content-engine:ci sh -c 'set -eux;             printf "%s" "The engine speaks for itself, which is the only claim worth testing here."               | piper --model /opt/piper/voices/en_US-lessac-medium.onnx --output_file /tmp/en.wav;             dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 /tmp/en.wav);             echo "narration: ${dur}s";             awk -v d="$dur" "BEGIN { exit (d > 1.5 ? 0 : 1) }"'
      - name: whisper.cpp transcribes speech inside the image
        run: |
          docker run --rm content-engine:ci sh -c 'set -eux; \
            piper --model /opt/piper/voices/en_US-lessac-medium.onnx --output_file /tmp/say.wav <<< "The quick brown fox jumps over the lazy dog near the river bank."; \
            ffmpeg -hide_banner -loglevel error -y -i /tmp/say.wav -ar 16000 -ac 1 -c:a pcm_s16le /tmp/in.wav; \
            whisper-cli -m /opt/whisper/ggml-base.bin -f /tmp/in.wav -oj -of /tmp/out -nt -l en; \
            cat /tmp/out.json; \
            grep -qi "fox" /tmp/out.json'
